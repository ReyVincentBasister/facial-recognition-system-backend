spring.application.name=attendance

# Database Connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/attendance
spring.datasource.username=admin
spring.datasource.password=admin

# JPA / Hibernate Configuration
# 'update' will create tables if they don't aexist and update schema if entities change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Fix for some Postgres driver versions regarding LOB creation
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true