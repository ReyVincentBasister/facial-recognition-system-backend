plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        // Updated to 24 to match your local installation
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Core Web Starter (fixes @RestController, @RequestMapping, ResponseEntity)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Explicitly add Jackson to fix "package com.fasterxml.jackson... does not exist"
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // JPA Data Starter (fixes @Entity, @Table, JpaRepository)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'
    
    // Lombok (fixes @Data, @Builder, @NoArgsConstructor, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Database Driver (H2)
    runtimeOnly 'com.h2database:h2' 

    // Base Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}